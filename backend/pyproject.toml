[project]
name = "recruitment-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2",
  "psycopg[binary]>=3",
  "alembic",
  "httpx",
  "tenacity",
  "apscheduler",
  "defusedxml",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "respx",
    "types-defusedxml>=0.7.0.20260504",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["db: requires PostgreSQL via TEST_DATABASE_URL"]
pythonpath = ["."]
